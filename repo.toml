[repo]
name = "usd-exchange-sample"
extra_tool_paths = [
    "_build/target-deps/usd-exchange/release/dev/tools/repoman",
    "_build/target-deps/usd-exchange/debug/dev/tools/repoman",
]


[repo.folders]
version_file = "CHANGELOG.md"

[repo_install_usdex]
enabled = true
usd_flavor = "usd"
usd_ver = "26.08"
python_ver = "3.12"

[repo_fetch_deps]
enabled = true
fetch.packman_target_files_to_pull = [
    "${root}/deps/target-deps.packman.xml",
    "${root}/deps/usd-exchange-deps.packman.xml",
]
fetch.packman_host_files_to_pull = [
    "${root}/deps/host-deps.packman.xml",
]

[repo.tokens]
# abi is platform-specific: glibc on linux, MSVC toolset on windows (the OpenUSD windows packages are built with v143)
"platform:linux-x86_64".abi = "2.35"
"platform:linux-aarch64".abi = "2.35"
"platform:windows-x86_64".abi = "v143"

[repo_test]
default_config = "release"
test_root = "${root}/_install/${platform}/${config}"
aggregated_log_file = "$root/_build/tests/test_results.xml"

[repo_test.suites.main]
kind = "glob_and_exec"
path = "$root/tools/wheel"
include = [
    "test${shell_ext}",
]
timeout = 600


